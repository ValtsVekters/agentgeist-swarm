[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgeist"
version = "0.1.0"
description = "Budget-supervised, role-scoped paranormal incident swarm"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai==1.15.32", "mcp>=1.10,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2", "tiktoken>=0.8,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agentgeist = "agentgeist.cli:main"
kickoff = "agentgeist.main:kickoff"
run_with_trigger = "agentgeist.main:run_with_trigger"
agentgeist-ui = "agentgeist.dashboard:main"

[tool.crewai]
type = "flow"
project_id = "c6adbc52-17c0-492c-a715-936ebf453960"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentgeist*"]

[tool.setuptools.package-data]
agentgeist = ["fixtures/*.json", "dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
