<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentgeist</title>
<meta name="agentgeist-token" content="__AGENTGEIST_TOKEN__">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#5d6472;--line:#e3e6eb;--accent:#5b4bd6;
--ok:#1f8a4c;--bad:#c2372e;--warn:#b7791f;--chip:#eef0f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaee;--muted:#9aa2b1;--line:#2a2f3a;
--accent:#8b7dff;--chip:#222733;--ok:#3ccf7e;--bad:#ff6b61;--warn:#f0b54a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:600;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin-top:12px}
#status{color:var(--muted);min-height:22px}
.result{border-radius:10px;padding:10px 12px;border:1px solid var(--line);margin-bottom:8px}
.result b{font-size:16px}
.evacuate{border-color:var(--bad)} .contain{border-color:var(--warn)} .observe{border-color:var(--ok)}
.result a{color:var(--accent)} .muted{color:var(--muted)}
.msg{padding:8px 0;border-top:1px solid var(--line)} .msg:first-child{border-top:0}
.who{font-weight:600} .said{white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <h1>👻 Agentgeist</h1>
  <section class="panel">
    <div class="row">
      <button data-tick="142">Tick 142</button>
      <button data-tick="143">Tick 143</button>
      <button data-tick="900">Tick 900</button>
    </div>
    <div class="row" style="margin-top:10px">
      <select id="count"><option>1</option><option>3</option><option selected>5</option><option>10</option></select>
      <button id="random">Run random ticks</button>
    </div>
    <label><input type="checkbox" id="discord" checked> Post to Discord</label>
  </section>
  <div id="status"></div>
  <section class="panel" id="resultsPanel" hidden><div id="results"></div>
    <button id="gmail">Send to Gmail</button> <span id="gmailStatus" class="muted"></span></section>
  <section class="panel" id="agentsPanel" hidden><div id="agents"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const token = document.querySelector('meta[name="agentgeist-token"]').content;
let offset = -1, running = false, ready = false;

function esc(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}
async function api(path, opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}

function onEvent(e){
  if(e.kind==="tick_start"){$("#agents").innerHTML="";$("#agentsPanel").hidden=false;return}
  if(e.kind!=="model_call") return;
  const el=document.createElement("div"); el.className="msg";
  el.innerHTML=`<div class="who">${esc(e.role)}</div><div class="said">${esc(e.answer)}</div>`;
  $("#agents").appendChild(el);
}

function showResults(last){
  if(!last){return}
  if(last.error){$("#resultsPanel").hidden=false;$("#results").innerHTML=`<div class="result evacuate">Stopped: ${esc(last.error.reason||last.error.type)}</div>`;return}
  $("#resultsPanel").hidden=false;
  $("#results").innerHTML=last.results.map(r=>{
    if(r.error) return `<div class="result evacuate">Tick ${esc(r.tick)} stopped: ${esc(r.error.reason||r.error.type)}</div>`;
    const d=r.discord, link=d&&d.url?` · <a href="${esc(d.url)}" target="_blank" rel="noopener">Discord</a>`:d&&d.status==="failed"?` · <span class="muted">Discord failed</span>`:"";
    return `<div class="result ${esc(r.action)}"><b>Tick ${esc(r.tick)}: ${esc(r.action.toUpperCase())}</b> ${r.matched?"✓":"✗"}${link}<div class="muted">${esc(r.rationale)}</div></div>`;
  }).join("");
}

let shown="";
async function poll(){
  try{const r=await api(`/api/events?offset=${offset}`);offset=r.offset;r.events.forEach(onEvent)}catch{}
  let s; try{s=await api("/api/status")}catch{return}
  ready=s.warm==="ready"; running=!!s.running;
  document.querySelectorAll("button").forEach(b=>b.disabled=running||!ready);
  $("#status").textContent=running?`${s.running.label}…`:ready?"":`Starting (${s.warm})…`;
  const key=JSON.stringify(s.last); if(key!==shown){shown=key;showResults(s.last)}
}
async function start(body){
  try{await api("/api/start",{method:"POST",headers:{"Content-Type":"application/json","X-Agentgeist-Token":token},
    body:JSON.stringify({...body,discord:$("#discord").checked})});
    $("#agents").innerHTML="";$("#results").innerHTML="";$("#resultsPanel").hidden=true;poll()}
  catch(e){alert("Could not start: "+e.message)}
}
document.querySelectorAll("button[data-tick]").forEach(b=>b.onclick=()=>start({kind:"saved",tick:b.dataset.tick}));
$("#random").onclick=()=>start({kind:"random",count:+$("#count").value});
$("#gmail").onclick=async()=>{$("#gmailStatus").textContent="Sending…";
  try{const r=await api("/api/email",{method:"POST",headers:{"Content-Type":"application/json","X-Agentgeist-Token":token},body:"{}"});
    $("#gmailStatus").textContent=r.configured?`Sent ${r.sent} of ${r.total}`:"Set AGENTGEIST_REPORT_EMAIL in .env"}
  catch(e){$("#gmailStatus").textContent="Failed: "+e.message}};
(async function loop(){await poll();setTimeout(loop,running?400:1500)})();
</script>
</body>
</html>
